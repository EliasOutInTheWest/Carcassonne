if(TL[S.board[L.x+','+L.y].t].m)seen.add('m'),b+=`<g transform="translate(${L.x*100} ${L.y*100})" data-a="mp" data-s="12" style="cursor:pointer"><circle cx="50" cy="52" r="11" fill="#fff" fill-opacity=".5"/>${meepleSVG(50,56,P.color)}</g>`}
if(S.pv!==shownP){shownP=S.pv;(S.pops||[]).forEach((o,i)=>{b+=`<text class="pop" x="${o.x*100+50+(i%2?22:-22)}" y="${o.y*100+45}" fill="${o.c}" stroke="#000" stroke-width="4" paint-order="stroke" font-family="Cinzel" font-weight="700" font-size="38" text-anchor="middle" style="animation-delay:${i*.25}s">+${o.pts}</text>`})}
$('#app').innerHTML=`<div id="side"><h2 style="margin:0;font-size:26px;letter-spacing:.06em;color:var(--gold)">🏰 Carcassonne</h2>${online?`<div class="cz" style="color:var(--mute)">Raum ${room}</div>`:''}
${S.players.map((p,i)=>`<div class="pl ${i==S.cur&&S.status!='over'?'on':''}"><span class="dot" style="background:${p.color}"></span>${p.name}<span class="sc">${p.score}</span><small style="display:flex;align-items:center"><svg width="16" height="20" viewBox="-10 -11 20 22">${meepleSVG(0,0,p.color)}</svg>×${p.meeples}</small></div>`).join('')}
${trk(S)}${S.status=='over'?`<h3>Spiel vorbei – ${[...S.players].sort((a,b)=>b.score-a.score)[0].name} gewinnt!</h3><button onclick="location.reload()">Neues Spiel</button>`:`
<div>${my?'<b>Du bist dran.</b>':`${P.name} ist dran…`} Noch ${S.deck.length} Kacheln.</div>
${S.phase=='tile'&&S.tile!=null&&my?`<svg width="110" height="110" viewBox="0 0 100 100" style="border:3px solid var(--gold);border-radius:6px;align-self:center">${tileSVG({t:S.tile,r:rot})}</svg><button onclick="rotate()">Drehen (R)</button>${tips?'<small>Klicke ein markiertes Feld, um die Kachel zu legen. Die Kanten müssen zu den Nachbarn passen.</small>':''}`:''}
${S.phase=='meeple'&&my?`<div>${P.meeples>0?'Meeple setzen? Klicke eine Figur auf der Kachel.':'Keine Meeple übrig.'}</div><button onclick="skip()">${P.meeples>0?'Ohne Meeple weiter':'Zug beenden'}</button>`:''}`}
<div style="display:flex;gap:8px"><button class="g" onclick="tut(0)">? Anleitung</button><button class="g" onclick="toggleTips()">Tipps ${tips?'an':'aus'}</button></div><div id="log">${S.log.slice(-12).reverse().map(l=>`<div>${l}</div>`).join('')}</div></div>
<svg id="board" viewBox="0 0 1000 700" style="box-shadow:inset 0 0 80px ${P.color}77"><rect width="1000" height="700" filter="url(#nz)" opacity=".13" style="pointer-events:none"/><g id="vp" transform="translate(${px} ${py}) scale(${zm})">${b}</g><rect width="1000" height="700" fill="url(#vg)" style="pointer-events:none"/></svg>${S.status=='over'?final():''}`;
bindBoard()}
function bindBoard(){const sv=$('#board'),vp=$('#vp');let d=null;
sv.onpointerdown=e=>{d={x:e.clientX,y:e.clientY};moved=false};
sv.onpointermove=e=>{if(!d)return;const k=1000/sv.clientWidth;if(Math.abs(e.clientX-d.x)+Math.abs(e.clientY-d.y)>3)moved=true;px+=(e.clientX-d.x)*k;py+=(e.clientY-d.y)*k;d={x:e.clientX,y:e.clientY};vp.setAttribute('transform',`translate(${px} ${py}) scale(${zm})`)};
sv.onpointerup=()=>d=null;
sv.onwheel=e=>{e.preventDefault();const k=e.deltaY<0?1.12:1/1.12;zm=Math.min(2.5,Math.max(.25,zm*k));px=500-(500-px)*k;py=350-(350-py)*k;vp.setAttribute('transform',`translate(${px} ${py}) scale(${zm})`)};
sv.onclick=e=>{if(moved)return;const el=e.target.closest('[data-a]');if(!el)return;if(el.dataset.a=='put')put(+el.dataset.x,+el.dataset.y);else placeMeeple(+el.dataset.s)}}
/* ---- Aktionen ---- */
function rotate(){rot=(rot+1)%4;draw()}
document.addEventListener('keydown',e=>{if(e.key=='r'||e.key=='R')if(S&&S.phase=='tile')rotate()});
function put(x,y){S.board[x+','+y]={t:S.tile,r:rot};S.last={x,y};S.phase='meeple';S.tile=null;if(S.players[S.cur].meeples<1)return skip();sync()}
function placeMeeple(s){const p=S.players[S.cur];p.meeples--;S.meeples.push({x:S.last.x,y:S.last.y,s,p:S.cur});skip()}
function skip(){finish(S);sync()}
function sync(){draw();if(online&&sb)sb.from('games').update({state:S}).eq('id',room).then(()=>{})}
/* ---- Menü & Lobby ---- */
function home(){setTimeout(test,0);$('#app').innerHTML=`<svg class="bgm" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">${mosaic()}</svg><div class="box"><h1 class="ttl cz" style="margin:0">Carcassonne</h1><input id="nm" placeholder="Dein Name" value="${localStorage.nm||''}">
<h3 style="margin:8px 0 0">Gemeinsam an einem Gerät</h3><div style="display:flex;gap:8px">${[2,3,4,5].map(n=>`<button class="g" onclick="local(${n})">${n} Spieler</button>`).join('')}</div>
<h3 style="margin:8px 0 0">Online mit Freunden</h3>${sb?`<button onclick="createRoom()">Raum erstellen</button><div style="display:flex;gap:8px"><input id="cd" placeholder="Raumcode" style="text-transform:uppercase"><button onclick="joinRoom()">Beitreten</button></div>`:'<small>Trage SB_URL und SB_KEY oben in index.html ein, um Online zu spielen.</small>'}<button class="g" onclick="tut(0)">Anleitung ansehen</button><small id="dbg" style="color:var(--mute)"></small></div>`}
async function test(){const el=$('#dbg');if(!sb||!el)return;el.textContent='Prüfe Datenbank…';try{const r=await fetch(cleanUrl(SB_URL)+'/rest/v1/games?select=id&limit=1',{headers:{apikey:SB_KEY.trim()}});el.textContent=r.ok?'Datenbank verbunden ✓':'Datenbank-Fehler '+r.status+': '+(await r.text()).slice(0,180)}catch(e){el.textContent='Keine Verbindung: '+e.message}}
const nm=()=>{const v=($('#nm').value||'Spieler').trim().slice(0,14);localStorage.nm=v;return v};
function local(n){S=newGame(Array.from({length:n},(_,i)=>({id:'l'+i,name:i?'Spieler '+(i+1):nm()})));draw()}
function sub(){ch=sb.channel('g'+room).on('postgres_changes',{event:'UPDATE',schema:'public',table:'games',filter:'id=eq.'+room},p=>{S=p.new.state;draw()}).subscribe()}
async function createRoom(){room=Math.random().toString(36).slice(2,6).toUpperCase();online=true;S={status:'lobby',host:me,players:[{id:me,name:nm()}]};const{error}=await sb.from('games').insert({id:room,state:S});if(error)return alert(error.message);sub();draw()}
async function joinRoom(){room=$('#cd').value.trim().toUpperCase();const name=nm(),{data,error}=await sb.from('games').select('state').eq('id',room).single();if(error||!data)return alert('Raum nicht gefunden');online=true;S=data.state;
if(!S.players.find(p=>p.id==me)){if(S.status!='lobby'||S.players.length>=5)return alert('Raum ist voll oder das Spiel läuft schon');S.players.push({id:me,name});await sb.from('games').update({state:S}).eq('id',room)}sub();draw()}
function lobby(){$('#app').innerHTML=`<div class="box"><h2 style="margin:0">Raum ${room}</h2><div>Schicke den Code an deine Freunde.</div>${S.players.map((p,i)=>`<div class="pl"><span class="dot" style="background:${COL[i]}"></span>${p.name}</div>`).join('')}
${S.host==me?`<button ${S.players.length<2?'disabled':''} onclick="start()">Spiel starten</button>`:'<small>Warte auf den Host…</small>'}</div>`}
function start(){S=newGame(S.players);sync()}
const trk=S=>`<svg viewBox="0 0 260 36" style="width:100%" aria-label="Punkteleiste"><rect x="8" y="12" width="244" height="8" rx="4" fill="#1e170f" stroke="#6b5a3e"/>${[0,25,50,75,100].map(v=>`<text x="${10+v*2.4}" y="34" font-size="8" fill="#b9a77e" text-anchor="middle">${v}</text>`).join('')}${S.players.map((p,i)=>`<circle cx="${10+(p.score%100)*2.4}" cy="${16+(i-2)*2.2}" r="6" fill="${p.color}" stroke="#000"/>`).join('')}</svg>`;
function final(){const r=[...S.players].sort((a,b)=>b.score-a.score);return `<div class="modal"><div class="mb"><h2 class="cz" style="margin:0">Spiel vorbei</h2>${r.map((p,i)=>`<div class="pl"><span>${['🥇','🥈','🥉','4.','5.'][i]}</span><span class="dot" style="background:${p.color}"></span>${p.name}<span class="sc">${p.score}</span></div><small style="color:var(--mute);margin:-6px 0 0 34px">${Object.entries(p.br||{}).map(([k,v])=>k+' '+v).join(', ')||'keine Wertung'}</small>`).join('')}<button onclick="location.reload()">Neues Spiel</button></div></div>`}
function mosaic(){let g='';for(let i=0;i<8;i++)for(let j=0;j<6;j++)g+=`<g transform="translate(${i*100} ${j*100})">${tileSVG({t:(i*7+j*5+i*j)%24,r:(i+j)%4},i*13+j)}</g>`;return g}
const TUT=[['Ziel','Sammle die meisten Punkte, indem du Städte, Straßen, Klöster und Wiesen mit Meeples besetzt.',[3,0]],
['Kachel legen','Du ziehst eine Kachel und legst sie an. Alle Kanten müssen zu den Nachbarn passen: Stadt an Stadt, Straße an Straße, Wiese an Wiese. Mit R oder „Drehen“ drehst du sie.',[9,1]],
['Meeple setzen','Danach darfst du einen Meeple auf ein Gebiet der neuen Kachel stellen, aber nur wenn in diesem Gebiet noch kein Meeple steht. Du hast 7 Stück.',[0,0,1]],
['Punkte','Fertige Stadt: 2 Punkte pro Kachel und pro Wappen. Straße: 1 Punkt pro Kachel. Kloster: 9 Punkte, wenn alle 8 Nachbarn liegen. Danach bekommst du den Meeple zurück. Wer die meisten Meeples im Gebiet hat, punktet.',[12,2]],
['Bauern und Ende','Meeples auf Wiesen bleiben bis zum Schluss liegen und bringen 3 Punkte pro angrenzender fertiger Stadt. Das Spiel endet, wenn der Stapel leer ist. Offene Gebiete geben dann je 1 Punkt pro Kachel.',[21,0]]];
function tut(i){let el=$('#tut');if(!el){el=document.createElement('div');el.id='tut';document.body.appendChild(el)}
if(i<0||i>=TUT.length){el.remove();return}const[t,x,d]=TUT[i];
el.innerHTML=`<div class="modal"><div class="mb"><div style="display:flex;justify-content:space-between;align-items:center"><h2 class="cz" style="margin:0">${t}</h2><button class="g" onclick="tut(-1)" aria-label="Schließen">✕</button></div>
<svg width="130" height="130" viewBox="0 0 100 100" style="align-self:center;border-radius:8px;filter:drop-shadow(0 6px 8px #000a)">${tileSVG({t:d[0],r:d[1]},3)}${d[2]?meepleSVG(50,58,'#e24b4b'):''}</svg><div>${x}</div>
<div style="text-align:center;color:var(--gold)">${TUT.map((_,k)=>k==i?'●':'○').join(' ')}</div>
<label><input type="checkbox" style="width:auto" ${tutOn?'checked':''} onchange="tutOn=this.checked;localStorage.tut=tutOn?1:0"> Anleitung beim Start zeigen</label>
<div style="display:flex;gap:8px">${i?`<button class="g" onclick="tut(${i-1})">Zurück</button>`:''}<button onclick="tut(${i+1})" style="margin-left:auto">${i<TUT.length-1?'Weiter':"Los geht's"}</button></div></div></div>`}
function toggleTips(){tips=!tips;localStorage.tips=tips?1:0;draw()}
draw();if(tutOn)tut(0);
</script></body></html>
